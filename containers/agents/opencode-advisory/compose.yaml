services:
  advisor:
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/agents/opencode-advisory:${EVAL_AGENT_TAG:-latest}
    entrypoint: ["/opt/agent/advisory/service/start.sh"]
    environment:
      ADVISOR_BASE_URL: ${ADVISOR_BASE_URL:-}
      ADVISOR_API_KEY: ${ADVISOR_API_KEY:-none}
      ADVISOR_MODEL: ${ADVISOR_MODEL:-}
      ADVISOR_SERVICE_HOST: ${ADVISOR_SERVICE_HOST:-0.0.0.0}
      ADVISOR_SERVICE_PORT: ${ADVISOR_SERVICE_PORT:-8001}
      ADVISOR_LOG_PAYLOADS: ${ADVISOR_LOG_PAYLOADS:-false}
      EVAL_ADVISOR_TIMEOUT_SECONDS: ${EVAL_ADVISOR_TIMEOUT_SECONDS:-300}
      EVAL_ADVISORY_CONFIG: ${EVAL_ADVISORY_CONFIG:-}
      EVAL_ADVISOR_SYSTEM_PROMPT: ${EVAL_ADVISOR_SYSTEM_PROMPT:-}
      EVAL_ADVISOR_SYSTEM_PROMPT_VARIANT: ${EVAL_ADVISOR_SYSTEM_PROMPT_VARIANT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${ADVISOR_SERVICE_PORT:-8001}/health"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 2s
    networks:
      - internal
      - upstream

  # The benchmark compose file is layered after this overlay and supplies the
  # real runner image. This placeholder only makes the overlay independently
  # publishable as an OCI Compose artifact.
  runner:
    image: ${EVAL_REGISTRY:-ghcr.io/exgentic}/agents/opencode-advisory:${EVAL_AGENT_TAG:-latest}
    depends_on:
      advisor:
        condition: service_healthy
    environment:
      ADVISORY_GATEWAY_URL: ${ADVISORY_GATEWAY_URL:-http://advisor:8001}
      EVAL_ADVISORY_CONFIG: ${EVAL_ADVISORY_CONFIG:-}
      EVAL_EXECUTOR_SYSTEM_PROMPT: ${EVAL_EXECUTOR_SYSTEM_PROMPT:-}
      EVAL_EXECUTOR_SYSTEM_PROMPT_VARIANT: ${EVAL_EXECUTOR_SYSTEM_PROMPT_VARIANT:-}
      EVAL_EXECUTOR_SYSTEM_PROMPT_POSITION: ${EVAL_EXECUTOR_SYSTEM_PROMPT_POSITION:-append}
      EVAL_OPENCODE_BASE_SYSTEM_PROMPT: ${EVAL_OPENCODE_BASE_SYSTEM_PROMPT:-}
      EVAL_ADVISOR_TOOL_DESCRIPTION_VARIANT: ${EVAL_ADVISOR_TOOL_DESCRIPTION_VARIANT:-}
      EVAL_ADVISOR_TOOL_DESCRIPTION: ${EVAL_ADVISOR_TOOL_DESCRIPTION:-}
      EVAL_ADVISOR_CONTEXT_MODE: ${EVAL_ADVISOR_CONTEXT_MODE:-agent-provided}
      EVAL_ADVISOR_FULL_CONTEXT_MAX_BYTES: ${EVAL_ADVISOR_FULL_CONTEXT_MAX_BYTES:-0}
      EVAL_ADVISOR_TIMEOUT_SECONDS: ${EVAL_ADVISOR_TIMEOUT_SECONDS:-300}
      EVAL_ADVISOR_INVOCATION_POLICY: ${EVAL_ADVISOR_INVOCATION_POLICY:-self-initiated}
      EVAL_ADVISOR_RANDOM_PROBABILITY: ${EVAL_ADVISOR_RANDOM_PROBABILITY:-}
      EVAL_ADVISOR_MAX_CALLS: ${EVAL_ADVISOR_MAX_CALLS:-}
      EVAL_ADVISOR_RANDOM_SEED: ${EVAL_ADVISOR_RANDOM_SEED:-}
      OPENJEV_BASE_URL: ${OPENJEV_BASE_URL:-}
      OPENJEV_API_KEY: ${OPENJEV_API_KEY:-}
      EVAL_ADVISOR_OPENJEV_TIMEOUT_SECONDS: ${EVAL_ADVISOR_OPENJEV_TIMEOUT_SECONDS:-30}
      EVAL_ADVISOR_OPENJEV_INTERVAL: ${EVAL_ADVISOR_OPENJEV_INTERVAL:-1}
      EVAL_ADVISOR_OPENJEV_POLICY_CONFIG: ${EVAL_ADVISOR_OPENJEV_POLICY_CONFIG:-}
      EVAL_ADVISOR_FIXED_TURN: ${EVAL_ADVISOR_FIXED_TURN:-}
      EVAL_ADVISOR_FIXED_INTERVAL: ${EVAL_ADVISOR_FIXED_INTERVAL:-}
      EVAL_EXECUTOR_MAX_TURNS: ${EVAL_EXECUTOR_MAX_TURNS:-0}
      ADVISORY_EXPERIMENT_ID: ${ADVISORY_EXPERIMENT_ID:-}
    networks:
      - internal

networks:
  internal:
    internal: true
  upstream: {}
